version: 1.0
runtime: docker
build:
  commands:
    build:
      - docker build -t notes-backend .
run:
  command: /app/notes_backend
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
    - name: SERVER_HOST
      value: "0.0.0.0"
    - name: RUST_LOG
      value: "info,tower_http=info"
    - name: MAX_CONNECTIONS
      value: "50"
    - name: BCRYPT_COST
      value: "10"
