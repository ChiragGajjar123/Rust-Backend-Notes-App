services:
  - type: web
    name: rust-notes-backend
    runtime: rust
    buildCommand: cargo build --release
    startCommand: ./target/release/notes_may_minihttp
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false          # set this secret in the Render dashboard
      - key: JWT_SECRET
        sync: false          # set this secret in the Render dashboard
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGIN
        value: "https://react-frontend-for-rust-backend-notes.netlify.app"
      - key: MAY_WORKERS
        value: "4"
